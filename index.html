<style>
  :root {
    --likud-blue: #0038B8;
    --likud-blue-deep: #002A6E;
    --likud-blue-ink: #001541;
    --likud-blue-soft: #E6EDF8;
    --likud-blue-mist: #F3F6FB;
    --likud-red: #C8102E;
    --ink: #0A1426;
    --ink-2: #38465C;
    --ink-3: #6E7A8E;
    --paper: #FFFFFF;
    --paper-2: #FAFBFD;
    --hairline: #E3E7EE;
    --font-display: "Rubik", "Heebo", system-ui, sans-serif;
    --font-body: "Rubik", "Heebo", system-ui, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-fast: 180ms;
    --dur: 260ms;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--paper); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body:lang(he) { font-family: "Heebo", "Rubik", system-ui, sans-serif; }
  body[dir="rtl"] { direction: rtl; }
  ::selection { background: var(--likud-blue); color: white; }
  a { color: inherit; text-decoration: none; }

  /* Site shell */
  .site {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Skip link */
  .skip {
    position: absolute;
    top: -100px; left: 16px;
    background: var(--likud-blue);
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 100;
    transition: top var(--dur) var(--ease);
  }
  .skip:focus { top: 16px; outline: 2px solid #fff; outline-offset: 2px; }

  /* Global header */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline);
  }
  .site-topbar {
    background: var(--paper-2);
    border-bottom: 1px solid var(--hairline);
    font-size: 12px;
    color: var(--ink-3);
  }
  .site-topbar-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 8px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .site-nav {
    max-width: 1280px; margin: 0 auto;
    padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .site-nav-brand {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--ink);
  }
  .site-nav-mark {
    width: 40px; height: 40px;
    background: var(--likud-blue); color: white;
    border-radius: 8px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; letter-spacing: -0.02em;
    font-family: var(--font-display);
  }
  .site-nav-brand-name {
    font-weight: 800; font-size: 17px; letter-spacing: -0.02em; line-height: 1;
  }
  .site-nav-brand-kicker {
    font-size: 10px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-top: 4px;
  }
  .site-nav-menu {
    display: flex; align-items: center; gap: 22px;
    font-size: 14.5px; font-weight: 500;
  }
  .site-nav-menu a {
    color: var(--ink-2);
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
    cursor: pointer;
  }
  .site-nav-menu a:hover { color: var(--likud-blue); }
  .site-nav-menu a.is-active {
    color: var(--likud-blue);
    border-bottom-color: var(--likud-blue);
  }
  .site-nav-tools {
    display: flex; align-items: center; gap: 14px;
  }
  .lang-pill {
    display: inline-flex; gap: 2px; padding: 3px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 11px; font-weight: 600;
    background: var(--paper);
  }
  .lang-pill button {
    border: 0; background: transparent;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink-3);
    font-family: inherit; font-size: 11px; font-weight: 600;
    transition: all var(--dur-fast) var(--ease);
  }
  .lang-pill button.is-active {
    background: var(--likud-blue);
    color: white;
  }
  .nav-cta {
    background: var(--likud-blue); color: white;
    border: 0; border-radius: 999px;
    padding: 10px 20px;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background var(--dur-fast) var(--ease);
  }
  .nav-cta:hover { background: var(--likud-blue-deep); }
  .nav-burger {
    display: none;
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--paper);
    cursor: pointer;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
  }
  .nav-burger span {
    width: 18px; height: 1.5px; background: var(--ink);
    transition: transform var(--dur) var(--ease);
  }

  /* Page area */
  .site-main {
    flex: 1;
    overflow-x: auto;
  }
  /* Each page renders inside this container; pages are 1280px wide */
  .page-frame {
    width: 100%;
    min-width: 0;
    overflow-x: auto;
    background: var(--paper);
  }
  .page-frame > * {
    margin: 0 auto;
  }

  /* Global footer */
  .site-footer {
    background: var(--likud-blue-ink);
    color: white;
    padding: 64px 24px 28px;
  }
  .site-footer-inner {
    max-width: 1280px; margin: 0 auto;
  }
  .site-footer-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 48px;
    padding-bottom: 40px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .site-footer h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.55);
    margin: 0 0 14px;
    font-weight: 600;
  }
  .site-footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13.5px; }
  .site-footer ul a { color: rgba(255,255,255,0.82); cursor: pointer; transition: color var(--dur-fast); }
  .site-footer ul a:hover { color: white; }
  .site-footer-legal {
    padding-top: 24px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: rgba(255,255,255,0.55);
    flex-wrap: wrap; gap: 12px;
  }

  /* Sticky mobile CTA */
  .mobile-cta {
    display: none;
    position: fixed;
    bottom: 16px; left: 16px; right: 16px;
    z-index: 60;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    box-shadow: 0 16px 40px -8px rgba(0,42,110,0.32);
    padding: 6px;
    align-items: center; justify-content: space-between;
    gap: 6px;
  }
  .mobile-cta button {
    flex: 1; border: 0;
    padding: 12px 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  .mobile-cta .primary { background: var(--likud-blue); color: white; }
  .mobile-cta .secondary { background: transparent; color: var(--ink); }

  /* Mobile menu overlay */
  .mobile-menu {
    position: fixed; inset: 0; z-index: 80;
    background: var(--likud-blue-ink);
    color: white;
    display: none;
    flex-direction: column;
    padding: 24px;
  }
  .mobile-menu.is-open { display: flex; }
  .mobile-menu-top {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.18);
  }
  .mobile-menu nav {
    margin-top: 32px;
    display: grid; gap: 0;
  }
  .mobile-menu nav a {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    color: white; cursor: pointer;
  }
  .mobile-menu nav a.is-active { color: #6E9DFF; }
  .mobile-menu-bottom {
    margin-top: auto;
    padding-top: 24px;
    display: flex; gap: 12px;
  }

  /* Mobile breakpoints */
  @media (max-width: 900px) {
    .site-nav-menu { display: none; }
    .nav-burger { display: flex; }
    .nav-cta { display: none; }
    .mobile-cta { display: flex; }
    .site-topbar { display: none; }
    .site-footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  }
  @media (max-width: 540px) {
    .site-footer-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

// ===== Site app =====

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

const NAV_ROUTES = [
  { id: "home",      keyN: "home" },
  { id: "about",     keyN: "about" },
  { id: "leadership", keyN: "leadership" },
  { id: "positions", keyN: "positions" },

  { id: "branches",  keyN: "branches" },
  { id: "contact",   keyN: "contact" },
];

// Localised "today" date that updates on lang change.
function LocalisedDate({ lang }) {
  const d = new Date();
  const fmt = lang === "he" ? "he-IL" : lang === "en" ? "en-US" : "ru-RU";
  const text = d.toLocaleDateString(fmt, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  return <bdi>{text}</bdi>;
}

// Accessible font-size scaler — actually changes root font-size, persists in localStorage.
function FontSizeControl({ lang }) {
  const STEPS = [0.875, 1, 1.15];
  const STORAGE_KEY = "likud_font_scale";
  const [idx, setIdx] = React.useState(() => {
    const stored = parseFloat(localStorage.getItem(STORAGE_KEY) || "");
    const i = STEPS.indexOf(stored);
    return i >= 0 ? i : 1;
  });
  React.useEffect(() => {
    document.documentElement.style.fontSize = (16 * STEPS[idx]) + "px";
    localStorage.setItem(STORAGE_KEY, STEPS[idx]);
  }, [idx]);
  const labels = {
    he: { hint: "מצב נגישות", smaller: "טקסט קטן יותר", normal: "טקסט רגיל", larger: "טקסט גדול יותר" },
    en: { hint: "Accessibility", smaller: "Smaller text", normal: "Normal text", larger: "Larger text" },
    ru: { hint: "Доступность", smaller: "Меньше шрифт", normal: "Обычный шрифт", larger: "Крупнее шрифт" },
  }[lang];
  const btn = (label, target, glyph) => (
    <button type="button" onClick={() => setIdx(target)} aria-label={label} title={label} style={{
      background: idx === target ? "var(--likud-blue)" : "transparent",
      color: idx === target ? "white" : "var(--ink-3)",
      border: "1px solid " + (idx === target ? "var(--likud-blue)" : "var(--hairline)"),
      borderRadius: 999, padding: "2px 8px", fontSize: 12, fontWeight: 600, cursor: "pointer",
      fontFamily: "inherit", lineHeight: 1.3, minWidth: 24,
    }}>{glyph}</button>
  );
  return (
    <span style={{ display: "inline-flex", gap: 8, alignItems: "center" }}>
      <span>{labels.hint}:</span>
      <span style={{ display: "inline-flex", gap: 4 }}>
        {btn(labels.smaller, 0, "A−")}
        {btn(labels.normal, 1, "A")}
        {btn(labels.larger, 2, "A+")}
      </span>
    </span>
  );
}

function useHashRoute() {
  const [route, setRoute] = React.useState(() => {
    const h = window.location.hash.replace(/^#\/?/, "");
    return h || "home";
  });
  React.useEffect(() => {
    const fn = () => {
      const h = window.location.hash.replace(/^#\/?/, "");
      setRoute(h || "home");
      window.scrollTo(0, 0);
    };
    window.addEventListener("hashchange", fn);
    return () => window.removeEventListener("hashchange", fn);
  }, []);
  const go = (id) => { window.location.hash = "#/" + id; };
  return [route, go];
}

function SiteHeader({ lang, setLang, route, onNav, onBurger }) {

  return (
    <header className="site-header" dir={dir}>

            <span>·</span>
            <FontSizeControl lang={lang} />
          </span>
        </div>
      </div>
      <div className="site-nav">
        <a className="site-nav-brand" href="#/home" aria-label="Likud — home">
          <img
            src={lang === "he" ? "images/logo-blue-he.svg" : lang === "en" ? "images/logo-blue-en.svg" : "images/logo-blue-ru.svg"}
            alt={lang === "he" ? "הליכוד" : lang === "en" ? "Likud" : "Ликуд"}
            style={{ height: 44, width: "auto", display: "block" }} />
          <span style={{ display: "none" }}>
            <span className="site-nav-brand-name">{lang === "he" ? "הליכוד" : "LIKUD"}</span>
          </span>
        </a>
        <nav className="site-nav-menu" aria-label="Main">
          {NAV_ROUTES.map(r => (
            <a key={r.id}
               href={"#/" + r.id}
               className={r.id === route || (route === "position-detail" && r.id === "positions") ? "is-active" : ""}>
              {t.nav[r.keyN]}
            </a>
          ))}
        </nav>
        <div className="site-nav-tools">
          <div className="lang-pill" role="tablist" aria-label="Language">
            {LANGS.map(L => (
              <button key={L.code}
                role="tab"

                className={lang === L.code ? "is-active" : ""}
                onClick={() => setLang(L.code)}>
                {L.short}

            ))}
          </div>
          <a className="nav-cta" href="#/join">{t.cta.join}</a>
          <button className="nav-burger" aria-label="Menu" onClick={onBurger}>
            <span /><span /><span />
          </button>
        </div>
      </div>
    </header>
  );
}

            </a>
            <p style={{ fontSize: 13, color: "rgba(255,255,255,0.68)", lineHeight: 1.6, margin: 0, maxWidth: 320 }}>
              {lang === "he" ? "כתובתנו: המלך ג׳ורג׳ 38, תל אביב · ת.ד. 56216, תל-אביב 6156101 · טלפון 03-6210666"
                : lang === "en" ? "Party HQ · 38 King George St., Tel Aviv · P.O.B. 56216, Tel Aviv 6156101 · Tel +972-3-6210666"
                : "Штаб партии · ул. Кинг-Джордж, 38, Тель-Авив · а/я 56216, Тель-Авив 6156101 · Тел. +972-3-6210666"}
            </p>
          </div>
          <div>
            <h4>{t.nav.about}</h4>
            <ul>
              <li><a href="#/about">{t.nav.about}</a></li>
              <li><a href="#/leadership">{t.nav.leadership}</a></li>
              <li><a href="#/primaries">{t.nav.primaries}</a></li>
            </ul>
          </div>
          <div>
            <h4>{t.nav.positions}</h4>

              {t.positionsList.slice(0, 4).map((p, i) => (
                <li key={i}><a href="#/positions">{p.title}</a></li>
              ))}
            </ul>
          </div>
          <div>
            <h4>{t.nav.contact}</h4>
            <ul>
              <li><a href="#/contact">{t.nav.contact}</a></li>
              <li><a href="#/branches">{t.nav.branches}</a></li>
              <li><a href="#/join">{t.cta.subscribe}</a></li>
            </ul>
          </div>
        </div>
        <div className="site-footer-social" style={{ paddingTop: 24, borderTop: "1px solid rgba(255,255,255,0.12)", display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.12, color: "rgba(255,255,255,0.5)" }}>
            {lang === "he" ? "רשתות חברתיות" : lang === "en" ? "Follow" : "Соцсети"}
          </span>
          <a href="https://www.facebook.com/LikudNetanyahu" target="_blank" rel="noopener" style={{ color: "rgba(255,255,255,0.85)", textDecoration: "underline" }}>Facebook</a>
          <a href="https://twitter.com/netanyahu" target="_blank" rel="noopener" style={{ color: "rgba(255,255,255,0.85)", textDecoration: "underline" }}>X / Twitter</a>
          <a href="https://www.youtube.com/user/Netanyahu/featured" target="_blank" rel="noopener" style={{ color: "rgba(255,255,255,0.85)", textDecoration: "underline" }}>YouTube</a>
        </div>
        <div className="site-footer-legal">
          <span>{t.footerLegal}</span>
          <span style={{ display: "inline-flex", gap: 18 }}>

              return <a key={i} href={hrefs[i] || "#/contact"} style={{ color: "rgba(255,255,255,0.55)", textDecoration: "underline" }}>{m}</a>;
            })}
          </span>
        </div>
      </div>

}

function MobileMenu({ open, lang, route, onNav, onClose, setLang }) {
  const t = CONTENT[lang];
  const dir = lang === "he" ? "rtl" : "ltr";
  return (
    <div className={"mobile-menu" + (open ? " is-open" : "")} dir={dir}>
      <div className="mobile-menu-top">

      <nav>
        {NAV_ROUTES.map(r => (

        <div className="lang-pill" style={{ background: "transparent", borderColor: "rgba(255,255,255,0.2)" }}>
          {LANGS.map(L => (
            <button key={L.code}

      </div>

}

// === Page wrappers ===

function HomePage({ lang }) {
  return (

// Page-frame wrapper that passes lang through to the multilingual page components.
function Wrap({ Comp, lang }) {
  return (
    <div className="page-frame">
      <Comp lang={lang} bare={true} />
    </div>
  );
}

// === App ===
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, go] = useHashRoute();
  const [menuOpen, setMenuOpen] = React.useState(false);
  const lang = t.lang;
  const setLang = (v) => setTweak("lang", v);
  const dir = lang === "he" ? "rtl" : "ltr";

  // Set html lang/dir
  React.useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = dir;
    document.body.dir = dir;
    document.body.lang = lang;
  }, [lang, dir]);

  // ESC closes mobile menu
  React.useEffect(() => {
    const fn = e => { if (e.key === "Escape") setMenuOpen(false); };
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, []);

  const pageNode = (() => {
    switch (route) {
      case "home":            return <HomePage lang={lang} />;
      case "about":           return <AboutPage lang={lang} />;
      case "leadership":      return <Wrap Comp={PageLeader} lang={lang} />;
      case "positions":       return <PositionsListPage lang={lang} />;
      case "position-detail": return <Wrap Comp={PagePosition} lang={lang} />;
      case "news":            return <Wrap Comp={PageNews} lang={lang} />;
      case "primaries":       return <Wrap Comp={PageNews} lang={lang} />;
      case "join":            return <Wrap Comp={PageJoin} lang={lang} />;
      case "branches":        return <Wrap Comp={PageBranches} lang={lang} />;
      case "contact":         return <Wrap Comp={PageContact} lang={lang} />;
      default:                return <HomePage lang={lang} />;
    }
  })();

  return (
    <div className="site">
      <SiteHeader
        lang={lang} setLang={setLang}
        route={route} onNav={go}
        onBurger={() => setMenuOpen(true)} />
      <MobileMenu
        open={menuOpen}
        lang={lang} setLang={setLang}
        route={route} onNav={go}
        onClose={() => setMenuOpen(false)} />

      <main className="site-main" id="main">
        {pageNode}
      </main>

      <SiteFooter lang={lang} onNav={go} />

      {/* Sticky mobile CTA */}
      <div className="mobile-cta">
        <a className="secondary" href="#/join" style={{ display: "grid", placeItems: "center", textDecoration: "none" }}>{CONTENT[lang].cta.support}</a>
        <a className="primary" href="#/join" style={{ display: "grid", placeItems: "center", textDecoration: "none" }}>{CONTENT[lang].cta.join}</a>
      </div>

      {/* Tweaks panel for language only */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Локаль" />
        <TweakRadio
          label="Язык"
          value={lang}
          options={["he", "en", "ru"]}
          onChange={(v) => setLang(v)} />
        <div style={{ padding: "8px 12px 0", fontSize: 11, color: "#6E7A8E", lineHeight: 1.5 }}>
          В Tailwind + Next.js версии — это `/he`, `/en`, `/ru` маршруты с автоопределением по Accept-Language.
        </div>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
